#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - unzip
  - htop
  - vim
  - docker.io

write_files:
  - path: /home/${username}/.ssh/authorized_keys
    owner: root:root
    permissions: '0600'
    content: |
      ${ssh_public_key}
  - path: /etc/sudoers.d/${username}
    owner: root:root
    permissions: '0440'
    content: |
      ${username} ALL=(ALL) NOPASSWD:ALL
  - path: /tmp/setup-k3d.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      # Install K3d
      curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      # Install kubectl
      curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/arm64/kubectl"
      install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      rm kubectl

      # Install Helm
      curl -s https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # Wait for Docker
      sleep 15

      # Create K3d HA cluster
      k3d cluster create k3s-ha-cluster \
        --servers ${k3d_masters} \
        --agents ${k3d_workers} \
        --port "8080:80@loadbalancer" \
        --port "8443:443@loadbalancer" \
        --port "6443:6443@loadbalancer" \
        --image rancher/k3s:latest \
        --k3s-arg "--disable=traefik@server:*" \
        --k3s-arg "--disable=servicelb@server:*" \
        --wait

      # Configure kubeconfig
      mkdir -p /home/${username}/.kube
      k3d kubeconfig get k3s-ha-cluster > /home/${username}/.kube/config
      chown -R ${username}:${username} /home/${username}/.kube

      # Install Nginx Ingress
      kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml
      kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=300s || true

runcmd:
  - useradd -m -s /bin/bash -G sudo ${username}
  - mkdir -p /home/${username}/.ssh
  - chmod 700 /home/${username}/.ssh
  - cp /home/${username}/.ssh/authorized_keys /tmp/auth_keys_temp
  - mv /tmp/auth_keys_temp /home/${username}/.ssh/authorized_keys
  - chown -R ${username}:${username} /home/${username}/.ssh
  - chown -R ${username}:${username} /home/${username}
  - systemctl enable --now docker
  - usermod -aG docker ${username}
  - /tmp/setup-k3d.sh

final_message: "K3d HA cluster ready - User ${username} created"
